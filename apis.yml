aid: decisionnext
name: DecisionNext
description: 'DecisionNext is a San Francisco-founded (2015) AI and machine-learning
  software company whose prescriptive analytics platform helps commodity-driven businesses
  decide what to buy and sell, when, at what price, and on what formula. The platform
  is organised in three layers — MarketView (transparent, commodity-specific price
  and supply forecasts built on USDA, CME and 100+ other market sources), Enterprise
  (scenario, formula, mix and timing optimisation through applications such as ScenarioLab,
  DecisionBuilder, MarketSim, DataMiner, YieldMax and MarketPosition) and Governance
  (executive accountability and market benchmarking). It serves food and agriculture
  (beef, pork, poultry, dairy, grains, edible oils) and natural resources (iron ore,
  thermal coal, LNG, copper, nickel, zinc, shipping). DecisionNext is delivered as
  a SaaS product — sold direct and through AWS Marketplace — and, as of this profiling
  pass, publishes no public API, SDK, developer portal or machine-readable specification.'
